name: Forge fitness app

# Lint, test and build Forge. Publishing to GitHub Pages happens in pages.yml,
# which deploys Forge and Lumen together (Pages serves one site per repo).

on:
  push:
    paths:
      - 'fitness/**'
      - '.github/workflows/fitness.yml'
  pull_request:
    paths:
      - 'fitness/**'
      - '.github/workflows/fitness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fitness/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
